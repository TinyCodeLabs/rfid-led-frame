<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>NTAG215 Backlight programmer</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="stylesheet" href="colorpicker.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<div class="column">
			<div class="container">
				<a class="button-link" href="app/app.apk" download="app.apk">Download Android App</a>
			</div>
			<h2>NTAG215 Backlight programmer</h2>

			<div class="container">
				<div id="led_grid">
					<div class="image">
						<canvas
							id="canvas"
							width="400"
							height="400"
							style="display: none"
						></canvas>
						<video id="video" autoplay></video>
					</div>
					<div id="top"></div>
					<div id="right"></div>
					<div id="left"></div>
					<div id="bottom"></div>
				</div>
			</div>
			<div class="container" id="captureContainer">
				<div style="display: flex; gap: 10px">
					<button id="snap">Capture</button>
					<button id="uploadBtn">Upload Photo</button>
				</div>
				<input type="file" id="fileInput" accept="image/*" style="display: none" />
			</div>
			<div class="container" id="recaptureContainer" style="display: none">
				<button id="recapture">Capture New Image</button>
			</div>
			<div class="container" id="pickerContainer" style="display: none">
				<h2 id="noPicker">Select a LED to pick color</h2>
				<div id="picker" style="display: none">
					<div id="sample"></div>
					<label for="hsl-h">Hue: <span id="hsl-h-value">0</span>°</label>
					<input
						type="range"
						min="0"
						step="0.1"
						max="360"
						id="hsl-h"
					/>
					<label for="hsl-s">Saturation: <span id="hsl-s-value">0</span>%</label>
					<input
						type="range"
						min="0"
						step="0.1"
						max="100"
						id="hsl-s"
					/>
					<label for="hsl-l">Lightness: <span id="hsl-l-value">50</span>%</label>
					<input
						type="range"
						min="0"
						step="0.1"
						max="100"
						id="hsl-l"
					/>
					<div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; font-size: 0.9em;">
						<div>RGB: <span id="rgb-values">0, 0, 0</span></div>
					</div>
					<div style="margin-top: 10px; display: flex; gap: 5px;">
						<button id="resetLedBtn" style="flex: 1;">Reset to Capture</button>
						<button id="deselectBtn" style="flex: 1;">Deselect</button>
					</div>
				</div>
				<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ccc;">
					<label for="saturation-slider">Global Saturation: <span id="saturation-value">100</span>%</label>
					<input
						type="range"
						min="0"
						step="1"
						max="500"
						value="200"
						id="saturation-slider"
					/>
				</div>
			</div>

			<div class="container" id="tagContainer" style="display: none">
				<button id="readBtn">Read Tag</button>
				<button id="writeBtn">Write Tag</button>

				<div id="status">Ready.</div>
				<div id="power-status" style="margin-top: 10px; font-size: 0.9em; color: #666;">Power: 0mA / 2500mA max</div>
			</div>
		</div>
		<script src="main.js"></script>
	</body>
</html>
