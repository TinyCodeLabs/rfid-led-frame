<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>NTAG215 Writer</title>
		<link rel="stylesheet" href="style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<div class="column">
			<h2>NTAG215 NDEF Writer</h2>

			<div class="container">
				<div class="camera-frame">
					<video id="video" autoplay></video>
				</div>
				<button id="snap">Capture</button>
			</div>

			<div class="container">
				<div id="led_grid">
					<div class="image">
						<canvas id="canvas" width="200" height="200"></canvas>
					</div>
					<div id="top"></div>
					<div id="right"></div>
					<div id="left"></div>
					<div id="bottom"></div>
				</div>
			</div>

			<div class="container">
				<input type="color" name="" id="picker" />
				<input
					type="file"
					id="imageInput"
					accept="image/*"
					capture="environment"
				/>
			</div>

			<div class="container">
				<button id="writeBtn">Write Tag</button>

				<div id="status">Ready.</div>
			</div>
		</div>
		<script src="ambicalc.js"></script>
		<script src="script.js"></script>
	</body>
</html>
