<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NTAG215 Writer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="column">
      <h2>NTAG215 NDEF Writer</h2>

      <div class="container">
        <input id="hexInput" type="text" placeholder="0123456789ABCDEF" />

        <button id="writeBtn">Write Tag</button>

        <div id="status">Ready.</div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function hexToBytes(hex) {
        if (typeof hex !== "string")
          throw new TypeError("Input must be a string");
        if (hex.length % 2 !== 0)
          throw new Error("Hex string must have an even number of characters");
        if (!/^[0-9a-fA-F]*$/.test(hex))
          throw new Error("Hex string contains invalid characters");

        const out = new Uint8Array(hex.length / 2);
        for (let i = 0; i < out.length; i++) {
          out[i] = Number.parseInt(hex.slice(i * 2, i * 2 + 2), 16);
        }
        return out;
      }

      document.getElementById("writeBtn").onclick = async () => {
        if (!("NDEFReader" in window)) {
          setStatus("Web NFC not supported.");
          return;
        }

        try {
          const hex = document.getElementById("hexInput").value.trim();

          if (!/^[0-9a-fA-F]*$/.test(hex)) {
            throw new Error("Invalid hex string");
          }

          const bytes = hexToBytes(hex);

          setStatus("Tap NTAG215...");

          const ndef = new NDEFReader();

          await ndef.write({
            records: [
              {
                recordType: "mime",
                mediaType: "v/led",
                data: bytes,
              },
            ],
          });

          setStatus(
            `Write successful.\n` + `Payload size: ${bytes.length} bytes`,
          );
        } catch (err) {
          setStatus("Write failed:\n" + err);
        }
      };
    </script>
  </body>
</html>
