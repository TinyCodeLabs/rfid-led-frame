<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>NTAG215 Writer</title>
		<link rel="stylesheet" href="style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	</head>
	<body>
		<div class="column">
			<h2>NTAG215 NDEF Writer</h2>

			<div class="container">
				<div id="led_grid">
					<div class="image">
						<canvas
							id="canvas"
							width="200"
							height="200"
							style="display: none"
						></canvas>
						<video id="video" autoplay></video>
					</div>
					<div id="top"></div>
					<div id="right"></div>
					<div id="left"></div>
					<div id="bottom"></div>
				</div>
			</div>
			<div class="container" id="captureContainer">
				<button id="snap">Capture</button>
			</div>
			<div class="container" id="pickerContainer" style="display: none">
				<input type="color" name="" id="picker" />
			</div>

			<div class="container" id="tagContainer" style="display: none">
				<button id="writeBtn">Write Tag</button>

				<div id="status">Ready.</div>
			</div>
		</div>
		<script src="ambicalc.js"></script>
		<script src="script.js"></script>
	</body>
</html>
